</script>
<style>
:root{
  --green:#2f9e44; --green-d:#237537; --green-l:#e8f5ec;
  --ink:#22272b; --ink-2:#3f474d; --muted:#6b7480; --faint:#95a0aa;
  --bg:#eef0f2; --card:#ffffff; --line:#e2e6ea; --line-2:#eef1f3;
  --amber:#9a6a00; --amber-bg:#fdf2d6; --red:#b42318; --red-bg:#fde7e4;
  --slate:#42566b; --slate-bg:#e5ebf1; --blue:#1f6feb; --blue-bg:#e6effd;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --shadow-lg:0 4px 16px rgba(16,24,40,.10);
  --r:10px; --r-sm:7px;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}
a{color:var(--green-d)}

/* ---------- Top bar ---------- */
.topbar{position:sticky; top:0; z-index:40; background:#1c2126; color:#fff;
  display:flex; align-items:center; gap:16px; padding:10px 20px; box-shadow:var(--shadow-lg);}
.topbar .logo{height:38px; width:auto; display:block; background:#1c2126; border-radius:4px}
.topbar .brand{display:flex; flex-direction:column; line-height:1.15}
.topbar .brand .t1{font-weight:700; font-size:15px; letter-spacing:.02em}
.topbar .brand .t2{font-size:11px; color:#9fb0a6; letter-spacing:.14em; text-transform:uppercase}
.topbar .spacer{flex:1}
.topbar .actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.btn{border:1px solid transparent; background:#2b333a; color:#e8edf1; padding:8px 13px; border-radius:var(--r-sm);
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:.12s;}
.btn:hover{background:#39434c}
.btn.primary{background:var(--green); color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.ghost{background:transparent; border-color:#3a444d; color:#cdd6dd}
.btn.ghost:hover{background:#2b333a}
.btn.on{background:var(--green); color:#fff; border-color:var(--green)}
.btn.warn{background:#7a2018}
.btn .ic{font-size:14px; line-height:1}

/* ---------- KPI strip ---------- */
.kpistrip{background:#232a30; color:#fff; padding:0 20px 14px}
.kpirow{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; max-width:1500px; margin:0 auto}
.kpi{background:#2b333a; border:1px solid #333d45; border-radius:var(--r); padding:11px 13px}
.kpi .lab{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#9aa6af; font-weight:600}
.kpi .val{font-size:20px; font-weight:750; margin-top:3px; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px; color:#8f9ba4; margin-top:1px}
.kpi.accent .val{color:#68d585}

/* ---------- Layout ---------- */
.wrap{display:flex; max-width:1600px; margin:0 auto; align-items:flex-start}
.sidebar{width:288px; flex:0 0 288px; padding:16px 12px 40px 16px; position:sticky; top:64px;
  max-height:calc(100vh - 64px); overflow-y:auto}
.main{flex:1; min-width:0; padding:18px 22px 80px}

/* toolbar */
.toolbarhost{background:var(--bg); border-bottom:1px solid var(--line);
  padding:12px 22px 12px; }
.toolbarhost .toolbar{max-width:1600px; margin:0 auto}
.toolbar{display:flex; gap:8px; align-items:center; margin-bottom:0; flex-wrap:wrap}
.search{flex:1; min-width:180px; position:relative}
.search input{width:100%; padding:9px 12px 9px 32px; border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--card); font-size:13.5px; box-shadow:var(--shadow)}
.search::before{content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:16px}
select.filter{padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card); font-size:13px; box-shadow:var(--shadow)}

/* sidebar property list */
.side-h{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin:6px 6px 8px}
.plist{list-style:none; margin:0; padding:0}
.pitem{padding:9px 11px; border-radius:var(--r-sm); cursor:pointer; margin-bottom:2px; display:flex; align-items:center; gap:9px; transition:.1s}
.pitem:hover{background:#e4e8ec}
.pitem.active{background:var(--green); color:#fff}
.pitem.active .pmeta{color:#d6f0dc}
.pitem .pnum{font-size:10px; font-weight:700; width:20px; height:20px; border-radius:5px; background:#dde3e8; color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; flex:0 0 20px}
.pitem.active .pnum{background:rgba(255,255,255,.25); color:#fff}
.pitem .pname{flex:1; font-size:13px; font-weight:600; line-height:1.25}
.pitem .pmeta{font-size:11px; color:var(--muted)}
.pitem .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dot.full{background:var(--green)} .dot.part{background:var(--amber)} .dot.empty{background:var(--red)}

/* property panel */
.phead{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:14px}
.phead .ptitle{font-size:21px; font-weight:750; letter-spacing:-.01em; margin:0 0 3px}
.phead .paddr{color:var(--muted); font-size:13px}
.phead .ptags{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px}
.tag{font-size:11.5px; padding:3px 9px; border-radius:20px; background:var(--line-2); color:var(--ink-2); font-weight:600; border:1px solid var(--line)}
.tag.own{background:#f0f4f8}

.snap{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin-bottom:14px}
.scard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; box-shadow:var(--shadow)}
.scard .lab{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600}
.scard .val{font-size:18px; font-weight:750; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.scard .sub{font-size:11px; color:var(--faint); margin-top:1px}
.scard .meter{height:5px; border-radius:3px; background:var(--line); margin-top:7px; overflow:hidden}
.scard .meter > i{display:block; height:100%; background:var(--green); border-radius:3px}

.section-lbl{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:6px 2px 8px; display:flex; align-items:center; gap:8px}

/* tenant table */
.ttable{width:100%; border-collapse:separate; border-spacing:0; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow)}
.ttable th{background:#f7f9fa; text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none}
.ttable th.l{text-align:left}
.ttable th:hover{color:var(--ink)}
.ttable th .arr{opacity:.5; font-size:9px}
.ttable td{padding:9px 10px; border-bottom:1px solid var(--line-2); text-align:right; font-variant-numeric:tabular-nums; font-size:13px; vertical-align:middle; white-space:nowrap}
.ttable td.l{text-align:left}
.ttable{min-width:960px}
.ttable th:first-child,.ttable td.tcell{min-width:210px; white-space:normal}
.tname{max-width:340px}
.trow{cursor:pointer; transition:.08s}
.trow:hover{background:#f4faf6}
.trow.vac{background:#fbfbfc; color:var(--faint)}
.trow.vac:hover{background:#f6f6f8}
.trow.open{background:var(--green-l)}
.trow.open:hover{background:var(--green-l)}
.tname{font-weight:650; color:var(--ink); display:flex; align-items:center; gap:7px}
.tname .exp{color:var(--faint); font-size:11px; transition:.15s; display:inline-block; width:10px}
.trow.open .tname .exp{transform:rotate(90deg); color:var(--green-d)}
.unitchip{font-size:11px; font-weight:600; color:var(--ink-2); background:var(--line-2); padding:1px 7px; border-radius:5px; border:1px solid var(--line)}
.miniflag{color:var(--amber); font-size:12px; margin-left:4px}
.sumrow td{background:#f7f9fa; font-weight:750; border-top:2px solid var(--line); border-bottom:none; font-size:13px}
.sumrow td.l{color:var(--ink)}

/* detail drawer */
.detail{background:#fbfdfc; border-bottom:1px solid var(--line-2)}
.detail td{padding:0}
.detail-inner{padding:16px 18px 20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px 26px; white-space:normal; text-align:left; position:sticky; left:0; box-sizing:border-box}
@media(max-width:820px){.detail-inner{grid-template-columns:1fr}}
.dsec{min-width:0}
@media(max-width:900px){.detail-inner{grid-template-columns:1fr}}
.dsec{}
.dsec h4{margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--green-d); font-weight:750;
  border-bottom:1px solid var(--line); padding-bottom:5px; display:flex; align-items:center; gap:6px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.kv dt{color:var(--muted); font-weight:600; white-space:nowrap}
.kv dd{margin:0; text-align:left; font-variant-numeric:tabular-nums}
.bul{margin:0; padding:0; list-style:none}
.bul li{position:relative; padding:3px 0 3px 15px; font-size:13px; color:var(--ink-2); line-height:1.5}
.bul li::before{content:"•"; position:absolute; left:2px; color:var(--green); font-weight:700}
.notetext{font-size:13px; color:var(--ink-2); line-height:1.55; white-space:pre-wrap}

/* rent change mini table */
.rctab{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px; table-layout:fixed}
.rctab th:nth-child(1),.rctab td:nth-child(1){width:27%}
.rctab th:nth-child(2),.rctab td:nth-child(2){width:16%}
.rctab th:nth-child(3),.rctab td:nth-child(3){width:15%}
.rctab th:nth-child(4),.rctab td:nth-child(4){width:42%}
.rctab th{text-align:left; color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase; padding:3px 8px 3px 0; border-bottom:1px solid var(--line)}
.rctab td{padding:4px 8px 4px 0; border-bottom:1px solid var(--line-2); font-variant-numeric:tabular-nums; vertical-align:top; overflow-wrap:anywhere}
.rctab td.amt{font-weight:700; white-space:normal}
.rctab tr.future td{background:#fbfbf3}
.rctab .cur{background:var(--green-l); color:var(--green-d); font-weight:700; font-size:9.5px; padding:1px 5px; border-radius:4px; margin-left:5px}

/* flags */
.flag{display:flex; gap:9px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line-2)}
.flag:last-child{border-bottom:none}
.flag .fic{color:var(--amber); flex:0 0 auto; font-size:13px; margin-top:1px}
.flag .ftxt{font-size:13px; color:var(--ink-2); line-height:1.5}
.mchip{display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; margin-right:7px;
  background:var(--slate-bg); color:var(--slate); letter-spacing:.02em; white-space:nowrap; vertical-align:1px}
.mchip.soon{background:var(--amber-bg); color:var(--amber)}
.mchip.past{background:var(--red-bg); color:var(--red)}

/* timeline */
.tl{list-style:none; margin:4px 0 0; padding:0; position:relative}
.tl::before{content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--line)}
.tl li{position:relative; padding:4px 0 8px 22px; font-size:12.5px}
.tl li .node{position:absolute; left:2px; top:8px; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--faint)}
.tl li.rent .node{border-color:var(--blue)} .tl li.lease_end .node{border-color:var(--red)}
.tl li.renewal .node{border-color:var(--slate)} .tl li.lease_start .node{border-color:var(--green)}
.tl li.fut{}
.tl li .td{font-weight:700; font-variant-numeric:tabular-nums}
.tl li .tlab{color:var(--ink-2)}
.tl .fbadge{font-size:9px; font-weight:700; color:var(--amber); background:var(--amber-bg); padding:0 5px; border-radius:4px; margin-left:6px}
.tl .note{display:block; color:var(--faint); font-size:11.5px; margin-top:1px}

/* editable inputs */
.ei{border:1px solid var(--line); border-radius:5px; padding:4px 7px; font-size:12.5px; width:100%; max-width:150px; background:#fff; font-variant-numeric:tabular-nums}
.ei.txt{max-width:100%; width:100%}
textarea.ei{max-width:100%; width:100%; min-height:70px; resize:vertical; line-height:1.5}
.editbar{grid-column:1/-1; display:flex; gap:8px; align-items:center; padding:10px 0 0; border-top:1px dashed var(--line); margin-top:2px}
.editbar .msg{font-size:12px; color:var(--muted)}
body.editing .trow{cursor:default}

.edited-badge{font-size:9px; font-weight:700; color:var(--blue); background:var(--blue-bg); padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:1px}

/* table (all tenants) view */
.gt-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.hidden{display:none!important}
.emptyish{color:var(--faint)}
.note-banner{font-size:12px; color:var(--muted); background:#fbfbf5; border:1px solid var(--line); border-left:3px solid var(--amber);
  border-radius:6px; padding:8px 12px; margin-bottom:12px; line-height:1.5}
.footer{max-width:1600px; margin:0 auto; padding:20px 22px 50px; color:var(--faint); font-size:11.5px; line-height:1.6}
.legend{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:11.5px; color:var(--muted)}
.legend b{color:var(--ink-2)}
.legend .li{display:inline-flex; align-items:center; gap:5px}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.pill.soon{background:var(--amber-bg);color:var(--amber)} .pill.past{background:var(--red-bg);color:var(--red)}
.pill.mtm{background:var(--slate-bg);color:var(--slate)} .pill.ok{background:var(--green-l);color:var(--green-d)}
.scrolltop{position:fixed;right:22px;bottom:22px;z-index:50;width:42px;height:42px;border-radius:50%;background:var(--green);
  color:#fff;border:none;font-size:18px;box-shadow:var(--shadow-lg);display:none}
</style>
</head>

curity deposit $5,000.00, assigned to the new tenant (\u00a77). Guaranties: Phillip M. Kauffman remains guarantor for the lease term, and DeHaven Corporation guarantees the lease for 24 months from 11/1/2024. Contact: David Crennan / Kayleigh Crennan, kcrennan11@gmail.com.","rent_changes":[{"amount":6279.78,"from":"2022-10-01","to":"2023-09-30","note":"First Amendment 9/29/2022, lease Yr 1 ($75,357.44/yr). Pre-2022 rent under the original 7/6/2017 lease started at $5,417.00/mo with 3% annual escalations; the exact rent-commencement date is not on file, so those tiers are not listed."},{"amount":6468.18,"from":"2023-10-01","to":"2024-09-30","note":"First Amendment Yr 2 ($77,618.16/yr)."},{"amount":6662.22,"from":"2024-10-01","to":"2025-09-30","note":"First Amendment Yr 3 ($79,946.70/yr). Yardi dates this scheduled charge 11/1/2024\u20139/30/2025, from the assignment rather than the lease year."},{"amount":6862.09,"from":"2025-10-01","to":"2026-09-30","note":"CURRENT rate \u2014 First Amendment Yr 4 ($82,345.10/yr). Yardi abstract, Apr\u2013Jun 2026 rent rolls and ACH receipts all agree with the amendment."},{"amount":7067.95,"from":"2026-10-01","to":"2027-09-30","note":"UPCOMING \u2014 First Amendment Yr 5 step ($84,815.45/yr), effective 10/1/2026 (+$205.86/mo). Already loaded as a Yardi scheduled charge."}],"flags":[{"text":"Rent increases to $7,067.95/mo on 10/1/2026","date":"2026-10-01","month":"2026-10","month_label":"Oct 2026"},{"text":"Assignor guaranty expires 11/1/2026 \u2014 diarize review","date":"2026-11-01","month":"2026-11","month_label":"Nov 2026"},{"text":"Lease-start mismatch: Yardi 11/1/2024 vs 10/1/2022 \u2014 reconcile","date":"2024-11-01","month":"2024-11","month_label":"Nov 2024"},{"text":"Lease ends 9/30/2027 (~14 mo), no renewal \u2014 40% of property rent","date":"2027-09-30","month":"2027-09","month_label":"Sep 2027"}],"timeline":[{"date":"2022-09-29","month":"2022-09","month_label":"Sep 2022","type":"renewal","label":"Renewal-option date (9/ ,"future":true,"note":""}]},{"tenant":"Strong Life, LLC dba CrossFit Staunton","unit":"SUITE_2","sqft":5000,"rent":2700,"rent_psf":0.54,"annual":32400,"nnn":176.02,"cam":148.98,"deposit":2500,"lease_from":"2018-01-06","lease_to":"2033-01-31","vacant_from":null,"flags_raw":"\u2022 PAST DUE $2,279.01 (0\u201330 days) \u2014 only real arrears in portfolio; pursue (see Delinquency)\n\u2022 Rent-roll balance $3,024.65 doesn't tie to $2,279.01 delinquency aging \u2014 reconcile\n\u2022 Recoveries under-recovered / apparently never trued up \u2014 run reconciliation\n\u2022 Next rent step 2/1/2027 to $2,800.00","renewal":"No renewal option in the lease and none recorded in Yardi (Options table is empty). Holdover (Art. 25): month-to-month at 150% of the then-expired base rent, with increases as provided in the lease.","notes":"Suite 2, approximately 5,000 SqFt of the former Elliott Chevrolet Building (Art. 1 and Exhibit A floor plan, which records total building size 25,232 SqFt). Lease dated 10/31/2017 between DDC, LLC and PHW, LLC and CrossFit Staunton, LLC (d/b/a CrossFit Staunton); assigned 8/22/2018, effective 9/1/2018, to Strong Life, LLC d/b/a CrossFit Staunton, with CrossFit Staunton, LLC remaining liable and Phil Lennon's guaranty continuing (Assignment \u00a7\u00a78\u20139). Delivery Date 1/5/2018; rent commenced the earlier of opening for business or thirty days after delivery, and the initial term runs fifteen (15) lease years to the day before the fifteenth anniversary \u2014 Yardi records 1/6/2018\u20131/31/2033. Use: crossfit, health and fitness business. Base rent steps every three lease years under Art. 4: $2,500.00 (Yrs 1\u20133) / $2,600.00 (Yrs 4\u20136) / $2,700.00 (Yrs 7\u20139) / $2,800.00 (Yrs 10\u201312) / $2,900.00 (Yrs 13\u201315); the Q2 2026 rate of $2,700.00 is the Yr 7\u20139 tier and matches Yardi, the rent rolls and the ACH receipts. Effectively a net lease and the only one at the property: the landlord carries liability insurance, fire insurance and real estate taxes at the tenant's expense (Arts. 10\u201312) and maintains the common areas at the tenant's expense (Art. 6), all reimbursed under Art. 24 as the tenant's proportionate share of CAMS, real estate taxes and landlord insurance plus an administrative fee capped at 10% of CAMS (excluding taxes and insurance). Art. 24 estimates that Additional Rent at $325.00 per month, which is exactly what Yardi bills: property tax $131.14 + insurance $44.88 = $176.02 NNN, plus CAM $148.98 (common-area electric $10.34, water $20.53, stormwater $26.12, maintenance $22.22, snow removal $19.80, grounds maintenance $49.97), each set up at a fixed 20.00% share with a 10% management fee on the six CAM components. Total monthly charge $3,025.00, paid by ACH. Late fee 5% of monthly rent if unpaid by the 5th, matching the Yardi setup. Security deposit $2,500.00, carried over at the assignment. Guarantor: Phil Lennon (Exhibit B). Contact: Kelly Lum, kelly.lum@outlook.com, (540) 292-0826.","detailed_flags":"(1) PAST DUE $2,279.01 \u2014 the only genuine arrears in the portfolio. The Yardi delinquency report shows Total Owed $5,304.01, of which $3,025.00 is the future July charge and $2,279.01 sits in the 0\u201330 day bucket. The last payment (7/7/2026) was $3,770.64 rather than the usual $3,025.00, i.e. a partial catch-up. Pursue collection; see the Delinquency tab.\n(2) CROSS-DEFAULT IS SPENT \u2014 CORRECTED: Art. 29 records that CrossFit Staunton, LLC and the adjacent tenant Valley Athletics, LLC (d/b/a Staunton Health and Fitness) are under common ownership and that a default here also defaults the Valley Athletics lease. That lease was TERMINATED on 5/6/2019 and Suite 2A is now let to a different entity (Queen City Strength Training, LLC) under a 5/7/2024 lease with no cross-default clause, so the arrears put 16% of the property's monthly rent at risk, not 42%. Phil Lennon's guaranty of THIS lease survives and he also remains liable on the 2019 Suite 2A promissory note \u2014 confirm with counsel before serving any default notice.\n(3) BALANCE DOES NOT TIE: the 6/30/2026 rent roll carries a $3,024.65 balance for this unit, which does not agree with the $2,279.01 aged figure on the delinquency report (both pulled 7/21/2026) \u2014 reconcile.\n(4) HISTORIC OVER-BILLING: the lease sets Yrs 1\u20133 at $2,500.00/mo, but the Yardi scheduled charge bills $2,600.00 from 1/6/2018 straight through 1/31/2024 \u2014 the Yr 1\u20133 tier was never loaded. That is roughly $100.00/mo for about 36 months (~$3,600.00) over-billed between 2018 and 2021. Every later tier matches the lease exactly, so the current $2,700.00 rate is correct and Q2 2026 is unaffected. Investigate and take advice on any credit due \u2014 the tenant is in arrears, so the two may need to be dealt with together.\n(5) RECOVERIES ARE UNDER-RECOVERED AND APPARENTLY NEVER TRUED UP: Art. 24 requires the landlord to compare actual to projected cost within six months of each calendar year end and bill or credit the difference, but the $325.00 estimate has been billed unchanged since 2018 and no reconciliation entry appears in the statements. At the 20% share on file, FY Jul-25\u2013Jun-26 reimbursable expenses of $34,676.82 imply about $6,935/yr recoverable versus $3,900/yr billed \u2014 roughly $3,035/yr under-recovered, before the 10% administrative fee. Run the reconciliation.\n(6) The 20.00% recovery share is consistent with 5,000 of the 25,232 SqFt building on Exhibit A (19.8%); it is not the 5,000 of 26,750 SqFt shown in the Yardi rent roll (18.7%), which includes the 1,750 SqFt LOW_LOT. Confirm which denominator Art. 24's \"Shopping Center\" is meant to use.\n(7) NEXT RENT STEP 2/1/2027 to $2,800.00 (Yrs 10\u201312), then $2,900.00 on 2/1/2030 \u2014 both already loaded in Yardi and matching the lease. See Rent Changes.","renewal_full":"No renewal option in the lease and none recorded in Yardi (Options table is empty). Holdover (Art. 25): month-to-month at 150% of th  Already loaded in Yardi."},{"date":"2033-01-31","month":"2033-01","month_label":"Jan 2033","type":"lease_end","label":"Lease expires (1/31/2033)","future":true,"note":""}]},{"tenant":"Queen City Strength Training, LLC \u2013 Staunton Health and Fitness","unit":"SUITE_2A","sqft":10000,"rent":4500,"rent_psf":0.45,"annual":54000,"nnn":null,"cam":null,"deposit":14000,"lease_from":"2024-03-01","lease_to":null,"vacant_from":null,"flags_raw":"\u2022 Fixed term expired 4/30/2025 \u2014 now MTM (60-day notice); get signed extension\n\u2022 Deposit conflict: lease $9,000 vs Yardi $14,000 \u2014 confirm\n\u2022 Lease-start conflict: Yardi 2/1/2018 vs lease 3/1/2024 \u2014 reconcile\n\u2022 Yardi $4,500 = July rent (Future), not arrears","renewal":"No renewal option. The Lease of 5/7/2024 (Art. 3) provides a two-month initial term, 3/1/2024\u20134/30/2024, which \"shall automatically renew for a one year term ending April 30, 2025 at the same monthly rent\"; only that single automatic renewal is granted and no further extension is on file. Either party may terminate on sixty (60) days' written notice (Art. 3). Art. 25 (Holding Over) is expressly \"Intentionally omitted\", so the tenancy has simply continued month-to-month at $4,500.00 since 5/1/2025, which is how Yardi carries it (Month-to-Month = Yes, blank Lease To). Art. 4 adds an automatic termination: if rent is not received by the 10th of the month the Lease terminates without further notice and the Tenant must vacate within 60 days.","notes":"Suite 2A, approximately 10,000 SqFt of the former Elliott Chevrolet Building (Art. 1), trading as Queen City Strength. CHAIN OF OCCUPANCY: the space was first let under a lease dated 10/31/2017 between DDC, LLC and PHW, LLC and Valley Athletics, LLC (d/b/a Staunton Health and Fitness), a fifteen-year term to 1/31/2033 at $5,000.00/mo rising to $5,800.00, guaranteed by Phil Lennon. That lease was TERMINATED by a Termination of Lease and Promissory Note dated 5/6/2019 (signed 5/10 and 5/14/2019): the tenant surrendered possession and the parties released each other, and $31,650.29 of arrears was converted into a 5% promissory note payable $500.00/mo for 74 months from 6/1/2019, made jointly by Valley Athletics, LLC and Phil Lennon individually. The tenant then occupied month-to-month with no written lease until the current Lease dated 5/7/2024 between DDC, LLC and PHW, LLC and Queen City Strength Training, LLC, guaranteed by Rebekah Page Hearn (Art. 29(c) and Exhibit B, notarised 5/7/2024). RENT $4,500.00/mo (Art. 4); the tenant paid $49,500.00 on or before 3/8/2024, comprising $31,500.00 of past-due rent, $9,000.00 for the two-month initial term and a $9,000.00 security deposit (two months). Paid by cheque each month (Apr ck #2079, May ck #2081, Jun ck #2082), each $4,500.00. GROSS LEASE \u2014 the landlord operates and maintains the common areas at its own expense (Arts. 6 and 24), pays all real estate taxes (Art. 12), insures the building (Art. 11) and pays water, sewer, trash and all common-area utilities (Art. 13); the tenant pays only its own heat, gas, electricity and similar. NNN and CAM columns are therefore correctly blank. Tenant maintains interior non-structural items, with HVAC maintenance capped at $1,000 per calendar year and a required biannual service contract (Art. 9(b)). Late fee: 10-day grace then $5.00 per day (Art. 4), matching the Yardi setup exactly. Notice address: 151 Old White Hill Road, Staunton, VA 24401. Contact: Rebekah \"Page\" Hearn, fitbullmom@gmail.com, (540) 290-0690.","detailed_flags":"(1) TENANT IDENTITY CORRECTED: the tenant is Queen City Strength Training, LLC, not Valley Athletics, LLC. The Valley Athletics lease was terminated on 5/6/2019 and a new lease was signed 5/7/2024 with a different entity and a different guarantor (Rebekah Page Hearn, not Phil Lennon). Yardi's tenant name \"Staunton Health and Fitness - Queen City Strength\" conflates the two \u2014 rename the tenant record.\n(2) CROSS-DEFAULT NO LONGER APPLIES: Art. 29 of the CrossFit (Suite 2) lease cross-defaults that lease with the Valley Athletics lease, which no longer exists. The 5/7/2024 Queen City Strength lease contains no cross-default or common-ownership provision. Suite 2A is therefore NOT exposed to the CrossFit arrears, and the earlier 42%-at-risk reading has been corrected on this tab and the Delinquency tab. Confirm with counsel before relying on this.\n(3) DEPOSIT CONFLICT: Art. 4 of the lease sets the security deposit at $9,000.00 (two months' rent), but Yardi and the Apr\u2013Jun 2026 rent rolls hold $14,000.00 (peach). The $5,000.00 difference is exactly the deposit taken under the terminated 2017 Valley Athletics lease (Art. 29), so the old deposit appears to have been carried forward \u2014 confirm and document, since the current lease does not entitle the landlord to hold it.\n(4) LEASE-START CONFLICT: Yardi shows Tenant Since / Lease From 2/1/2018 and a scheduled charge running from 2/1/2018, but the operative lease commences 3/1/2024. The table uses the lease date (peach). The 2018 date belongs to the terminated Valley Athletics tenancy \u2014 reconcile in Yardi.\n(5) FIXED TERM EXPIRED 4/30/2025: the single automatic renewal ended then and no further extension is on file, so the tenancy runs month-to-month, terminable by either party on 60 days' notice. It is treated here as an ongoing tenancy rather than a vacancy because $4,500.00 is still billed and paid. Obtain a signed extension.\n(6) HISTORIC UNDER-BILLING (settled): the 2017 lease set Yrs 1\u20133 at $5,000.00/mo, but the Yardi scheduled charge bills $4,500.00 from 2/1/2018 onward, so the contractual tier was never loaded. Any shortfall for 2018\u201319 was subsumed into the $31,650.29 note on termination; noted for completeness only, Q2 2026 is unaffected.\n(7) 2019 PROMISSORY NOTE \u2014 STATUS UNKNOWN: $31,650.29 at 5%, $500.00/mo for 74 months from 6/1/2019, with the entire unpaid balance due at the 74th payment (\u22 /* ---------- edit overrides (localStorage) ---------- */
const LS_KEY='tig_lease_overrides_v1';
let overrides={};
try{overrides=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){overrides={}}
function saveOverrides(){try{localStorage.setItem(LS_KEY,JSON.stringify(overrides))}catch(e){}}
function tid(pnum,t){return pnum+'|'+(t.unit||'')+'|'+t.tenant}

/* apply overrides + compute derived, returns a working copy */
function tenantView(pnum,t){
  const id=tid(pnum,t); const ov=overrides[id]||{};
  const v=Object.assign({},t,ov);
  const sqft=numOrNull(v.sqft), rent=numOrNull(v.rent);
  if(rent!=null){ v.annual = rent*12; v.rent_psf = (sqft&&sqft>0)? rent/sqft : v.rent_psf; }
  v._edited=Object.keys(ov).length>0; v._id=id;
  return v;
}
function numOrNull(x){ if(x===null||x===undefined||x==='')return null; const n=+x; return isNaN(n)?null:n; }

/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
function money(x,dec=2){ if(x===null||x===undefined||x==='')return '—'; const n=+x; if(isNaN(n))return esc(x);
  return '$'+n.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function money0(x){return money(x,0)}
function numf(x){ if(x===null||x===undefined||x==='')return '—'; const n=+x; if(isNaN(n))return esc(x); return n.toLocaleString('en-US'); }
function psf(x){ if(x===null||x===undefined||x==='')return '—'; const n=+x; if(isNaN(n))return '—'; return '$'+n.toFixed(2); }
function esc(s){ if(s===null||s===undefined)return ''; return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dfmt(s){ if(!s)return '—'; const d=parseDate(s); if(!d)return esc(s); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }
function parseDate(s){ if(!s)return null; if(s instanceof Date)return s; const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]); const d=new Date(s); return isNaN(d)?null:d; }
function monthsUntil(s){ const d=parseDate(s); if(!d)return null; return (d.getFullYear()-REPORT_DATE.getFullYear())*12+(d.getMonth()-REPORT_DATE.getMonth()); }
function isVac(t){ return (t.tenant||'').toUpperCase()==='VACANT' || !t.tenant; }

/* lease status pill */
function leaseStatus(t){
  if(isVac(t)) return {cls:'',lab:''};
  const to=t.lease_to;
  if(!to){ return {cls:'mtm',lab:'MTM'}; }
  const mu=monthsUntil(to);
  if(mu===null) return {cls:'',lab:''};
  if(mu<0) return {cls:'past',lab:'Expired'};
  if(mu<=12) return {cls:'soon',lab:'≤12 mo'};
  return {cls:'ok',lab:'Active'};
}

/* ---------- portfolio KPIs ---------- */
function computePortfolio(){
  let occ=0,vac=0,rent=0,ann=0,nnn=0,cam=0,occSqft=0,totSqft=0,props=RAW.length;
  RAW.forEach(p=>{
    (p.tenants||[]).forEach(t0=>{
      const t=tenantView(p.num,t0);
      if(isVac(t)){vac++;}
      else{ occ++; rent+=numOrNull(t.rent)||0; ann+=numOrNull(t.annual)||0; nnn+=numOrNull(t.nnn)||0; cam+=numOrNull(t.cam)||0; occSqft+=numOrNull(t.sqft)||0; }
    });
    totSqft+=numOrNull(p.sqft)||0;
  });
  return {occ,vac,rent,ann,nnn,cam,occSqft,totSqft,props};
}
function renderKPIs(){
  const k=computePortfolio();
  const occPct= k.totSqft? Math.round(100*k.occSqft/k.totSqft):0;
  const psfAll = k.occSqft? k.rent/k.occSqft : 0;
  const cards=[
    ['Properties',k.props,''],
    ['Occupied Units',k.occ,k.vac+' vacant'],
    ['Total Monthly Rent',money0(k.rent),'',true],
    ['Total Annual Rent',money0(k.ann),''],
    ['Blended $/SF','$'+psfAll.toFixed(2),'per mo'],
    ['Total NNN / mo',money0(k.nnn),''],
    ['Total CAM / mo',money0(k.cam),''],
    ['SqFt Occupancy',occPct+'%',numf(k.occSqft)+' sf'],
  ];
  $('#kpirow').innerHTML=cards.map(c=>`<div class="kpi ${c[3]?'accent':''}"><div class="lab">${c[0]}</div><div class="val">${c[1]}</div><div class="sub">${c[2]||'&nbsp;'}</div></div>`).join('');
}

/* ---------- property snapshot ---------- */
function propAgg(p){
  let rent=0,ann=0,nnn=0,cam=0,occSqft=0,occ=0,vac=0;
  (p.tenants||[]).forEach(t0=>{ const t=tenantView(p.num,t0);
    if(isVac(t)) vac++; else { occ++; rent+=numOrNull(t.rent)||0; ann+=numOrNull(t.annual)||0; nnn+=numOrNull(t.nnn)||0; cam+=numOrNull(t.cam)||0; occSqft+=numOrNull(t.sqft)||0; }
  });
  const o=p.occupancy&&p.occupancy.occupied, tt=p.occupancy&&p.occupancy.total;
  const unitsOcc = o&&o.units!=null? o.units : occ;
  const unitsTot = tt&&tt.units!=null? tt.units : (occ+vac);
  const totSqft = numOrNull(p.sqft)||occSqft;
  return {rent,ann,nnn,cam,occSqft,occ,vac,unitsOcc,unitsTot,totSqft,
    sqftPct: totSqft? Math.round(100*occSqft/totSqft):0,
    psf: occSqft? rent/occSqft:0};
}

function scard(lab,val,sub,pct){

}

];
function tenantTable(prop, items, showSummary){

      body+=`<td class="${c.l?'l':''} ${c.k==='tenant'?'tcell':''}">${val}</td>`;

/* ---------- tenant detail drawer ---------- */
function tenantDetail(p,t){
  const v=tenantView(p.num,t); const ed=document.body.classList.contains('editing');
  const rcs=t.rent_changes||[]; const flags=t.flags||[]; const tl=t.timeline||[];
  // Column A: key facts + rent changes
  let facts=`<div class="dsec"><h4>◧ Lease Facts</h4><dl class="kv">
    ${kv('Tenant', ed?inp(v,'tenant','txt'):esc(v.tenant))}
    ${kv('Unit', ed?inp(v,'unit'):esc(v.unit||'—'))}
    ${kv('Square Footage', ed?inp(v,'sqft'):numf(v.sqft))}
    ${kv('Monthly Rent', ed?inp(v,'rent'):money(v.rent))}
    ${kv('$/SF', psf(v.rent_psf)+(ed?' <span class="emptyish">(auto)</span>':''))}
    ${kv('Annual Rent', money0(v.annual)+(ed?' <span class="emptyish">(auto)</span>':''))}
    ${kv('NNN Pmts', ed?inp(v,'nnn'):money(v.nnn))}
    ${kv('CAM Pmts', ed?inp(v,'cam'):money(v.cam))}
    ${kv('Deposit', ed?inp(v,'deposit'):money(v.deposit))}
    ${kv('Lease From', ed?inp(v,'lease_from','txt'):dfmt(v.lease_from))}
    ${kv('Lease To', ed?inp(v,'lease_to','txt'):dfmt(v.lease_to))}
    ${v.vacant_from?kv('Vacant From',dfmt(v.vacant_from)):''}
  </dl></div>`;

  let rc='';
  if(rcs.length){
    rc=`<div class="dsec"><h4>↗ Rent Rate Changes &amp; Dates</h4><table class="rctab"><thead><tr><th>Rent</th><th>From</th><th>To</th><th>Note</th></tr></thead><tbody>`;
    rcs.forEach(c=>{ const fut=parseDate(c.from)&&parseDate(c.from)>REPORT_DATE;
      const cur=c.note&&/current/i.test(c.note);
      rc+=`<tr class="${fut?'future':''}"><td class="amt">${money(c.amount)}${cur?'<span class="cur">CURRENT</span>':''}${fut?'<span class="cur" style="background:var(--amber-bg);color:var(--amber)">UPCOMING</span>':''}</td><td>${dfmt(c.from)}</td><td>${dfmt(c.to)}</td><td>${esc(c.note||'')}</td></tr>`;
    });
    rc+=`</tbody></table></div>`;
  }
  const colA=`<div>${facts}${rc}</div>`;

  // Column B: renewal, notes, flags, timeline
  let renewal=`<div class="dsec"><h4>⟳ Renewal Options</h4>${
    ed? `<textarea class="ei" data-f="renewal" data-id="${v._id}">${esc(v.renewal||'')}</textarea>`
      : (v.renewal? `<ul class="bul">${bullets(v.renewal)}</ul>` : `<span class="emptyish">No renewal option on file.</span>`)
  }</div>`;
  let notes=`<div class="dsec"><h4>❏ Lease Notes</h4>${
    ed? `<textarea class="ei" data-f="notes" data-id="${v._id}">${esc(v.notes||'')}</textarea>`
      : (v.notes? `<ul class="bul">${bullets(v.notes)}</ul>` : `<span class="emptyish">—</span>`)
  }${ (!ed&&v.notes_full&&v.notes_full!==v.notes)?`<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--green-d);font-size:12px;font-weight:600">Full lease detail ▾</summary><div class="notetext" style="margin-top:6px">${esc(v.notes_full)}</div></details>`:'' }</div>`;

  let flagsHtml=`<div class="dsec"><h4>⚑ Flags <span style="color:var(--faint);font-weight:600">(${flags.length})</span></h4>`;
  if(flags.length){
    flagsHtml+=flags.map(f=>{
      let chip='';
      if(f.month_label){ const mu=f.month?monthsUntil(f.month+'-01'):null;
        const cls = mu!==null&&mu<0?'past':(mu!==null&&mu<=12?'soon':'');
        chip=`<span class="mchip ${cls}">${esc(f.month_label)}</span>`; }
      return `<div class="flag"><span class="fic">⚑</span><span class="ftxt">${chip}${esc(f.text)}</span></div>`;
    }).join('');
  } else flagsHtml+=`<span class="emptyish">No flags.</span>`;
  flagsHtml+=`</div>`;

  let tlHtml='';
  if(tl.length){
    tlHtml=`<div class="dsec"><h4>▤ Lease Events Timeline</h4><ul class="tl">`+
      tl.map(e=>`<li class="${e.type} ${e.future?'fut':''}"><span class="node"></span>
        <span class="td">${esc(e.month_label)}</span> — <span class="tlab">${esc(e.label)}</span>${e.future?'<span class="fbadge">UPCOMING</span>':''}
        ${e.note?`<span class="note">${esc(e.note)}</span>`:''}</li>`).join('')
      +`</ul></div>`;
  }
  const colB=`<div>${renewal}${notes}${flagsHtml}${tlHtml}</div>`;

  let editbar='';
  if(ed){ editbar=`<div class="editbar"><button class="btn primary" data-saveid="${v._id}" style="background:var(--green)">Save changes</button>
    ${v._edited?`<button class="btn ghost" data-revertid="${v._id}" style="border-color:var(--line);color:var(--muted)">Revert this tenant</button>`:''}
    <span class="msg">Edits are saved in your browser and included in Excel exports.</span></div>`; }

  return `<div class="detail-inner">${colA}${colB}${editbar}</div>`;
}
function kv(k,v){ return `<dt>${k}</dt><dd>${v}</dd>`; }
function inp(v,f,cls=''){ const val=(v[f]===null||v[f]===undefined)?'':v[f]; return `<input class="ei ${cls}" data-f="${f}" data-id="${v._id}" value="${esc(val)}">`; }
function bullets(txt){ return String(txt).split(/\n+/).map(s=>s.replace(/^[•\-\*]\s*/,'').replace(/^\(\d+\)\s*/,'').trim()).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join(''); }

/* ---------- row wiring ---------- */
function wireRows(){
  $$('.trow').forEach(r=>{
    r.onclick=(e)=>{
      if(document.body.classList.contains('editing')&&e.target.closest('.ei'))return;
      const pn=+r.dataset.p, i=+r.dataset.i;
      const det=$(`tr.detail[data-detail="${pn}-${i}"]`);
      const open=r.classList.contains('open');
      if(open){ r.classList.remove('open'); det.classList.add('hidden'); det.firstElementChild.innerHTML=''; }
      else{ r.classList.add('open'); det.classList.remove('hidden');
        const p=RAW.find(x=>x.num===pn); det.firstElementChild.innerHTML=tenantDetail(p,p.tenants[i]);
        wireDetail(det); sizeDetail(det); }
    };
  });
  $$('.ttable th[data-sort]').forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.sort; if(SORT.key===k)SORT.dir*=-1; else {SORT.key=k;SORT.dir=1;} rerender(); };
  });
}
function sizeDetail(det){
  // size the sticky drawer to the visible width of its scroll container so the
  // two columns always fit without horizontal scrolling, regardless of table width.
  const inner=det.querySelector('.detail-inner'); if(!inner)return;
  const gw=det.closest('.gt-wrap');
  const w = gw? gw.clientWidth : (document.querySelector('.main')||{}).clientWidth;
  if(w) inner.style.width=w+'px';
}
function sizeAllDetails(){ $$('.detail:not(.hidden)').forEach(d=>sizeDetail(d)); }
window.addEventListener('resize',sizeAllDetails);
function wireDetail(scope){
  $$('.ei',scope).forEach(el=>{
    el.addEventListener('change',()=>{}); // live edit stored on save
  });
  $$('[data-saveid]',scope).forEach(b=> b.onclick=()=>saveTenant(b.dataset.saveid,scope));
  $$('[data-revertid]',scope).forEach(b=> b.onclick=()=>{ delete overrides[b.dataset.revertid]; saveOverrides(); rerender(); renderKPIs(); buildSidebar(); });
}
function saveTenant(id,scope){
  const ov=overrides[id]||{};
  $$('.ei',scope).forEach(el=>{ const f=el.dataset.f; let val=el.value; ov[f]=val; });
  overrides[id]=ov; saveOverrides(); rerender(); renderKPIs(); buildSidebar();
}

/* filter + sort */
let FILTER='all', QUERY='';
function applyFilterSort(items){
  items=items.filter(({p,t})=>{
    const v=tenantView(p.num,t);
    if(FILTER!=='all'){
      const st=leaseStatus(v);
      if(FILTER==='vacant'&&!isVac(v))return false;
      if(FILTER==='occupied'&&isVac(v))return false;
      if(FILTER==='soon'&&st.cls!=='soon')return false;
      if(FILTER==='expired'&&st.cls!=='past')return false;
      if(FILTER==='mtm'&&st.cls!=='mtm')return false;
      if(FILTER==='flagged'&&!(t.flags||[]).length)return false;
    }
    if(QUERY){ const q=QUERY.toLowerCase();
      const hay=[p.name,v.tenant,v.unit,v.notes,v.renewal,(t.flags||[]).map(f=>f.text).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  if(SORT.key){ const k=SORT.key;
    items.sort((A,B)=>{ const a=sortVal(A,k),b=sortVal(B,k);
      if(a===null&&b===null)return 0; if(a===null)return 1; if(b===null)return -1;
      if(typeof a==='number'&&typeof b==='number')return (a-b)*SORT.dir;
      return String(a).localeCompare(String(b))*SORT.dir; });
  }
  return items;
}
function sortVal({p,t},k){
  if(k==='_prop')return p.num;
  const v=tenantView(p.num,t);
  if(['sqft','rent','rent_psf','annual','nnn','cam','deposit'].includes(k)){ return numOrNull(v[k]); }
  if(k==='lease_from'||k==='lease_to'){ const d=parseDate(v[k]); return d?d.getTime():null; }
  return (v[k]||'').toString().toLowerCase();
}

/* ----- styling helpers for a polished workbook ----- */
const XL_BORDER={style:'thin',color:{rgb:'D8DEE3'}};
function xlBorders(){return {top:XL_BORDER,bottom:XL_BORDER,left:XL_BORDER,right:XL_BORDER};}
function styleSheet(ws, nrows, ncols, cfg){
  cfg=cfg||{}; const money=new Set(cfg.money||[]), int=new Set(cfg.int||[]), pct=new Set(cfg.pct||[]), wrap=new Set(cfg.wrap||[]);
  const headerAlign=c=>({horizontal:(money.has(c)||int.has(c)||pct.has(c))?'right':'left',vertical:'center',wrapText:true});
  for(let R=0;R<nrows;R++){
    for(let C=0;C<ncols;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr]) ws[addr]={t:'s',v:''};
      const cell=ws[addr];
      if(R===0){
        cell.s={font:{bold:true,sz:11,name:'Calibri',color:{rgb:'FFFFFF'}},
                fill:{patternType:'solid',fgColor:{rgb:'237537'}},
                alignment:headerAlign(C), border:xlBorders()};
      } else {
        const band=(R%2===0);
        const isMoney=money.has(C), isInt=int.has(C), isPct=pct.has(C), isWrap=wrap.has(C);
        const s={font:{sz:10,name:'Calibri',color:{rgb:'2A2F33'}},
                 alignment:{vertical:isWrap?'top':'center',wrapText:isWrap,
                            horizontal:(isMoney||isInt||isPct)?'right':'left'},
                 border:xlBorders()};
        if(band) s.fill={patternType:'solid',fgColor:{rgb:'EEF5F0'}};
        if(isMoney) s.numFmt='$#,##0.00';
        else if(isInt) s.numFmt='#,##0';
        else if(isPct) s.numFmt='0"%"';
        cell.s=s;
      }
    }
  }
  ws['!rows']=[{hpt:24}];
}
function exportExcel(){
  const wb=XLSX.utils.book_new();

    <select class="filter" id="filterSel">
      <option value="all">All leases</option>
      <option value="occupied">Occupied only</option>
      <option value="vacant">Vacant only</option>
      <option value="soon">Lease ends ≤ 12 mo</option>
      <option value="expired">Expired / holdover</option>
      <option value="mtm">Month-to-month</option>
      <option value="flagged">Has flags ⚑</option>
    </select>`;
  $('#toolbarHost').appendChild(bar);
  $('#globalSearch').addEventListener('input',e=>{ QUERY=e.target.value; setActiveViewBtn('viewTable'); renderTable(); });
  $('#filterSel').addEventListener('change',e=>{ FILTER=e.target.value; setActiveViewBtn('viewTable'); renderTable(); });
}

/* ---------- footer ---------- */
function renderFooter(){
  $('#footer').innerHTML=`Triangle Investment Group — Lease Dashboard · Data sourced from Yardi lease abstracts, monthly statements &amp; the Q2 2026 Quarterly Property Reports (prepared Jul 21, 2026). ·
  Figures reflect Q2 2026 (Apr 1 – Jun 30, 2026). "Upcoming" flags are relative to Jul 21, 2026. ·
  Edits you make are stored only in this browser; use <b>Export Excel</b> to save a copy. Flags marked ⚑ include month tags so you can pull the items relevant to any monthly property report.`;
}

/* ---------- init ---------- */
function init(){
  renderKPIs(); buildSidebar(); injectGlobalToolbar(); renderFooter();
  renderProperty(RAW[0]);
  $('#propSearch').addEventListener('input',buildSidebar);
  $('#viewProp').onclick=()=>{ setActiveViewBtn('viewProp'); const p=RAW.find(x=>x.num===CURRENT)||RAW[0]; renderProperty(p); };
  $('#viewTable').onclick=()=>{ setActiveViewBtn('viewTable'); renderTable(); };
  $('#exportBtn').onclick=exportExcel;
  $('#editToggle').onclick=()=>{ document.body.classList.toggle('editing'); const on=document.body.classList.contains('editing');
    $('#editToggle').classList.toggle('on',on); $('#editToggle').innerHTML=on?'✓ Editing':'✎ Edit'; $('#resetBtn').classList.toggle('hidden',!on||Object.keys(overrides).length===0); rerender(); };
  $('#resetBtn').onclick=()=>{ if(confirm('Discard ALL edits and restore original data?')){ overrides={}; saveOverrides(); rerender(); renderKPIs(); buildSidebar(); } };
  const stopEl=$('#scrolltop'); window.addEventListener('scroll',()=>{ stopEl.style.display=window.scrollY>400?'block':'none'; });
  stopEl.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  setActiveViewBtn('viewProp');
}
function setActiveViewBtn(id){ ['viewProp','viewTable'].forEach(x=>$('#'+x).classList.toggle('on',x===id)); }
init();
</script>
</body>
</html>
